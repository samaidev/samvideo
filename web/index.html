<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamVideo - AI Video Generator</title>
<link rel="icon" type="image/png" href="/web/logo.png">
<style>
:root {
  --bg: #faf6f0;
  --card: #ffffff;
  --card-hover: #fdf5ea;
  --border: #e8ddd0;
  --text: #3d3530;
  --text-dim: #9a8d7e;
  --accent: #e8602e;
  --accent-hover: #d4501a;
  --accent-light: #fce8de;
  --green: #5a9e3e;
  --blue: #3b7dd8;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(180, 160, 130, 0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

/* Logo */
.header-logo { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; box-shadow: 0 2px 8px rgba(232, 96, 46, 0.2); }

/* Header */
.header { display: flex; align-items: baseline; gap: 0.65rem; margin-bottom: 1.5rem; }
.header h1 { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
.header .version { font-size: 1rem; font-weight: 600; opacity: 0.72; text-decoration: none; color: var(--text-dim); }
.header .version:hover { opacity: 1; text-decoration: underline; }

/* Form */
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text); }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; padding: 0.6rem 0.8rem; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
textarea { resize: vertical; min-height: 80px; }
select { cursor: pointer; }

/* Settings Grid */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.settings-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
.settings-card h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
.settings-card .form-group { margin-bottom: 0.75rem; }
.settings-card .form-group:last-child { margin-bottom: 0; }

/* Advanced Settings */
.advanced-toggle { cursor: pointer; padding: 0.5rem 0; font-size: 0.9rem; font-weight: 500; color: var(--text-dim); user-select: none; }
.advanced-toggle:hover { color: var(--accent); }
.advanced-content { display: none; padding: 0.75rem; margin-top: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.advanced-content.show { display: block; }

/* Buttons */
.btn { padding: 0.6rem 1.5rem; border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 6px rgba(232, 96, 46, 0.3); }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(232, 96, 46, 0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--card-hover); border-color: var(--accent); }
.btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
.btn-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; }

/* Progress */
.progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #7bc043); transition: width 0.5s; border-radius: 4px; }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid var(--border); }
.tab { padding: 0.5rem 1rem; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--text-dim); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Status Filter Tabs */
.status-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.status-tab { padding: 0.35rem 0.9rem; border: 1px solid var(--border); border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--text-dim); background: var(--card); transition: all 0.2s; }
.status-tab:hover { border-color: var(--accent); color: var(--text); }
.status-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
.status-tab .count { font-size: 0.75rem; opacity: 0.8; margin-left: 0.2rem; }

/* Task Cards Grid */
.task-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.task-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
.task-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(180, 160, 130, 0.2); }
.task-card .thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: var(--bg); overflow: hidden; }
.task-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.task-card .thumb .thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--text-dim); background: linear-gradient(135deg, #f5f0ea, #e8ddd0); }
.task-card .thumb .play-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.task-card:hover .play-overlay { opacity: 1; }
.task-card .play-overlay svg { width: 48px; height: 48px; fill: white; }
.task-card .thumb .badge { position: absolute; top: 8px; right: 8px; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; color: white; }
.badge.complete { background: var(--green); }
.badge.processing { background: var(--blue); }
.badge.failed { background: var(--accent); }
.task-card .info { padding: 0.75rem; }
.task-card .info .subject { font-size: 0.9rem; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.25rem; }
.task-card .info .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-dim); }
.task-card .info .meta .progress-text { font-weight: 600; }
.task-card .info .actions { display: flex; gap: 0.25rem; margin-top: 0.5rem; }

/* Pagination */
.pagination { display: flex; justify-content: center; align-items: center; gap: 0.5rem; margin-top: 1rem; }
.pagination button { padding: 0.35rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); color: var(--text); cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
.pagination button:hover { border-color: var(--accent); color: var(--accent); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.pagination button.active { background: var(--accent); color: white; border-color: var(--accent); }
.pagination .page-info { font-size: 0.8rem; color: var(--text-dim); margin: 0 0.5rem; }

/* Video Preview */
.video-preview { margin-top: 1.5rem; }
.video-preview video { width: 100%; border-radius: var(--radius); box-shadow: var(--shadow); }

/* Toast */
.toast { position: fixed; top: 1rem; right: 1rem; padding: 0.75rem 1.25rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); z-index: 999; opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.toast.show { opacity: 1; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--accent); }

/* Template cards */
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
.template-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 0.75rem; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; box-shadow: var(--shadow); }
.template-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(232, 96, 46, 0.15); }
.template-card.selected { border-color: var(--accent); background: var(--accent-light); }
.template-card h4 { font-size: 0.9rem; margin-bottom: 0.25rem; color: var(--text); }
.template-card p { font-size: 0.75rem; color: var(--text-dim); }
.template-card .tags { display: flex; gap: 0.25rem; margin-top: 0.5rem; flex-wrap: wrap; }
.template-card .tag { font-size: 0.7rem; padding: 0.1rem 0.4rem; background: var(--bg); border-radius: 3px; color: var(--text-dim); }

/* Video Player Modal */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal-content { background: var(--card); border-radius: var(--radius); padding: 1.5rem; max-width: 900px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
.modal-content video { width: 100%; border-radius: var(--radius); }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
.modal-header h3 { font-size: 1.1rem; color: var(--text); }
.modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-dim); padding: 0; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.modal-close:hover { background: var(--bg); color: var(--text); }

/* Current Task Progress */
.current-task-box { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); margin-bottom: 1rem; }

@media (max-width: 768px) {
  .header h1 { font-size: 1.5rem; }
  .task-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <img src="/web/logo.png" alt="SamVideo" class="header-logo">
    <h1>SamVideo</h1>
    <a href="https://github.com/samaidev/samvideo" target="_blank" class="version">v1.0</a>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('create')">视频生成</div>
    <div class="tab" onclick="switchTab('templates')">模板列表</div>
    <div class="tab" onclick="switchTab('tasks')">任务历史</div>
  </div>

  <!-- Create Tab -->
  <div id="tab-create">
    <div class="form-group">
      <label>视频主题</label>
      <textarea id="video_subject" placeholder="输入视频主题，例如：人工智能改变未来生活" rows="3"></textarea>
    </div>
    <div class="settings-grid">
      <div class="settings-card">
        <h3>视频设置</h3>
        <div class="form-group">
          <label>宽高比</label>
          <select id="video_aspect">
            <option value="">自动（LLM分类）</option>
            <option value="16:9">16:9 横屏</option>
            <option value="9:16">9:16 竖屏</option>
            <option value="1:1">1:1 正方形</option>
          </select>
        </div>
        <div class="form-group">
          <label>片段时长 (秒)</label>
          <input type="number" id="video_clip_duration" value="5" min="1" max="15">
        </div>
        <div class="form-group">
          <label>播放速度</label>
          <input type="number" id="video_clip_speed" value="1.0" min="0.5" max="2.0" step="0.1">
        </div>
        <div class="form-group">
          <label>转场模式</label>
          <select id="video_transition_mode">
            <option value="">自动</option>
            <option value="shuffle">随机</option>
            <option value="fade_in">淡入</option>
            <option value="fade_out">淡出</option>
            <option value="none">无</option>
          </select>
        </div>
      </div>
      <div class="settings-card">
        <h3>配音设置</h3>
        <div class="form-group">
          <label>语音音色</label>
          <select id="voice_name">
            <option value="">自动</option>
            <option value="zh-CN-YunxiNeural">云希（男声）</option>
            <option value="zh-CN-YunyangNeural">云扬（男声）</option>
            <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
            <option value="zh-CN-XiaoyiNeural">晓伊（女声）</option>
            <option value="zh-CN-YunjianNeural">云健（男声）</option>
          </select>
        </div>
        <div class="form-group">
          <label>语速</label>
          <input type="number" id="voice_rate" value="1.0" min="0.5" max="2.0" step="0.1">
        </div>
      </div>
      <div class="settings-card">
        <h3>字幕设置</h3>
        <div class="form-group">
          <label>字幕</label>
          <select id="subtitle_enabled">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
        </div>
        <div class="form-group">
          <label>字幕来源</label>
          <select id="subtitle_provider">
            <option value="edge">Edge (自动)</option>
          </select>
        </div>
      </div>
      <div class="settings-card">
        <h3>背景音乐</h3>
        <div class="form-group">
          <label>BGM 类型</label>
          <select id="bgm_type">
            <option value="random">随机选择</option>
            <option value="none">无</option>
          </select>
        </div>
        <div class="form-group">
          <label>BGM 音量</label>
          <input type="number" id="bgm_volume" value="0.55" min="0" max="1.0" step="0.05">
        </div>
      </div>
    </div>
    <div class="advanced-toggle" onclick="toggleAdvanced()">▶ 高级设置</div>
    <div class="advanced-content" id="advanced_content">
      <div class="settings-grid">
        <div class="settings-card">
          <h3>素材设置</h3>
          <div class="form-group">
            <label>素材来源</label>
            <select id="video_source">
              <option value="">默认</option>
              <option value="openai_image">AI文生图</option>
              <option value="local">本地素材</option>
            </select>
          </div>
        </div>
        <div class="settings-card">
          <h3>自定义脚本</h3>
          <div class="form-group">
            <label>视频脚本（可选，留空自动生成）</label>
            <textarea id="video_script" rows="3" placeholder="输入自定义脚本，留空则由AI自动生成"></textarea>
          </div>
        </div>
      </div>
    </div>
    <div class="btn-row" style="margin-top: 1rem;">
      <button class="btn btn-primary" id="generate_btn" onclick="generateVideo()">🎬 生成视频</button>
      <button class="btn btn-secondary" onclick="resetForm()">重置</button>
    </div>
    <div id="current_task" style="display:none;">
      <div class="current-task-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
          <span class="status processing" id="current_status" style="font-weight:600; color:var(--blue);">处理中</span>
          <span id="current_progress" style="font-weight:600; color:var(--text-dim);">0%</span>
        </div>
        <div style="font-size:0.9rem; color:var(--text); margin-bottom:0.5rem;" id="current_subject"></div>
        <div class="progress-bar"><div class="progress-fill" id="current_progress_bar" style="width: 0%"></div></div>
      </div>
    </div>
    <div class="video-preview" id="video_preview" style="display:none;">
      <h3 style="margin-bottom: 0.5rem;">视频预览</h3>
      <video id="preview_video" controls></video>
      <div style="margin-top: 0.5rem;">
        <a class="btn btn-secondary btn-sm" id="download_link" download>⬇ 下载视频</a>
      </div>
    </div>
  </div>

  <!-- Templates Tab -->
  <div id="tab-templates" style="display:none;">
    <h3 style="margin-bottom: 1rem;">可用模板</h3>
    <div class="template-grid" id="template_grid"></div>
  </div>

  <!-- Tasks Tab -->
  <div id="tab-tasks" style="display:none;">
    <!-- Status Filter -->
    <div class="status-tabs" id="status_tabs">
      <div class="status-tab active" onclick="filterTasks(0)">全部 <span class="count" id="count-all">0</span></div>
      <div class="status-tab" onclick="filterTasks(1)">已完成 <span class="count" id="count-completed">0</span></div>
      <div class="status-tab" onclick="filterTasks(4)">生成中 <span class="count" id="count-processing">0</span></div>
      <div class="status-tab" onclick="filterTasks(-1)">失败 <span class="count" id="count-failed">0</span></div>
    </div>
    <!-- Task Cards -->
    <div class="task-grid" id="task_grid"></div>
    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Video Player Modal -->
<div class="modal-overlay" id="video_modal" onclick="closeModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="modal_title">视频播放</h3>
      <button class="modal-close" onclick="closeVideoModal()">✕</button>
    </div>
    <video id="modal_video" controls autoplay style="width:100%;"></video>
    <div style="margin-top:0.5rem; display:flex; gap:0.5rem;">
      <a class="btn btn-secondary btn-sm" id="modal_download" download>⬇ 下载</a>
      <button class="btn btn-secondary btn-sm" id="modal_delete_btn" onclick="deleteTaskFromModal()">🗑 删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin + '/api/v1';
let selectedTemplate = '';
let pollTimer = null;
let currentFilter = 0;
let currentPage = 1;
let modalTaskId = null;

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(d => d.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'templates') loadTemplates();
  if (tab === 'tasks') loadTasks();
}

// Advanced settings toggle
function toggleAdvanced() {
  const content = document.getElementById('advanced_content');
  const toggle = event.target;
  content.classList.toggle('show');
  toggle.textContent = content.classList.contains('show') ? '▼ 高级设置' : '▶ 高级设置';
}

// Toast
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Generate video
async function generateVideo() {
  const subject = document.getElementById('video_subject').value.trim();
  if (!subject) { showToast('请输入视频主题', 'error'); return; }

  const params = { video_subject: subject };
  const fields = {
    video_aspect: 'video_aspect', video_clip_duration: 'video_clip_duration',
    video_clip_speed: 'video_clip_speed', video_transition_mode: 'video_transition_mode',
    voice_name: 'voice_name', voice_rate: 'voice_rate',
    subtitle_enabled: 'subtitle_enabled', subtitle_provider: 'subtitle_provider',
    bgm_type: 'bgm_type', bgm_volume: 'bgm_volume',
    video_source: 'video_source', video_script: 'video_script'
  };
  for (const [id, key] of Object.entries(fields)) {
    const el = document.getElementById(id);
    if (!el) continue;
    let val = el.value.trim();
    if (!val) continue;
    if (['video_clip_duration','voice_rate','bgm_volume','video_clip_speed'].includes(key)) val = parseFloat(val);
    if (key === 'subtitle_enabled') val = val === 'true';
    params[key] = val;
  }

  let url = API + '/videos';
  if (selectedTemplate) url += '?template_id=' + selectedTemplate;

  document.getElementById('generate_btn').disabled = true;
  document.getElementById('generate_btn').textContent = '⏳ 生成中...';

  try {
    const resp = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await resp.json();
    if (data.status === 200) {
      const taskId = data.data.task_id;
      showToast('任务已提交: ' + taskId.substring(0, 8) + '...', 'success');
      document.getElementById('current_task').style.display = 'block';
      document.getElementById('current_subject').textContent = subject;
      pollTask(taskId);
    } else {
      showToast('提交失败: ' + (data.error || '未知错误'), 'error');
      resetGenerateBtn();
    }
  } catch (e) {
    showToast('网络错误: ' + e.message, 'error');
    resetGenerateBtn();
  }
}

function resetGenerateBtn() {
  document.getElementById('generate_btn').disabled = false;
  document.getElementById('generate_btn').textContent = '🎬 生成视频';
}

// Poll task status
function pollTask(taskId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const resp = await fetch(API + '/tasks/' + taskId);
      const data = await resp.json();
      const task = data.data;
      if (!task) return;
      const progress = task.progress || 0;
      document.getElementById('current_progress').textContent = progress + '%';
      document.getElementById('current_progress_bar').style.width = progress + '%';

      const stateMap = {1: '完成', '-1': '失败', 4: '处理中'};
      const stateText = stateMap[task.state] || '处理中';
      const statusEl = document.getElementById('current_status');
      statusEl.textContent = stateText;
      const colorMap = {1: 'var(--green)', '-1': 'var(--accent)', 4: 'var(--blue)'};
      statusEl.style.color = colorMap[task.state] || 'var(--blue)';

      if (task.state === 1) {
        clearInterval(pollTimer); pollTimer = null;
        resetGenerateBtn();
        if (task.video_url) {
          document.getElementById('video_preview').style.display = 'block';
          document.getElementById('preview_video').src = task.video_url;
          document.getElementById('download_link').href = task.video_url;
        }
        showToast('视频生成完成！', 'success');
      } else if (task.state === -1) {
        clearInterval(pollTimer); pollTimer = null;
        resetGenerateBtn();
        showToast('生成失败: ' + (task.error || '未知错误'), 'error');
      }
    } catch (e) { console.error(e); }
  }, 3000);
}

// Load templates
async function loadTemplates() {
  try {
    const resp = await fetch(API + '/templates');
    const data = await resp.json();
    const grid = document.getElementById('template_grid');
    grid.innerHTML = '';
    (data.data || []).forEach(t => {
      const card = document.createElement('div');
      card.className = 'template-card' + (selectedTemplate === t.id ? ' selected' : '');
      card.onclick = () => { selectedTemplate = selectedTemplate === t.id ? '' : t.id; loadTemplates(); };
      card.innerHTML = `
        <h4>${t.name}</h4>
        <p>${t.description}</p>
        <div class="tags">
          <span class="tag">${t.aspect}</span>
          <span class="tag">${t.clip_duration}s</span>
          <span class="tag">${t.clip_speed}x</span>
          <span class="tag">${t.transition_mode}</span>
          <span class="tag">BGM ${t.bgm_volume}</span>
        </div>`;
      grid.appendChild(card);
    });
  } catch (e) { showToast('加载模板失败', 'error'); }
}

// Filter tasks by state
function filterTasks(state) {
  currentFilter = state;
  currentPage = 1;
  document.querySelectorAll('.status-tab').forEach(t => t.classList.remove('active'));
  event.target.closest('.status-tab').classList.add('active');
  loadTasks();
}

// Load tasks with pagination
async function loadTasks() {
  try {
    let url = API + '/tasks?page=' + currentPage + '&size=30';
    if (currentFilter !== 0) url += '&state=' + currentFilter;

    const resp = await fetch(url);
    const data = await resp.json();

    // Update counts
    const counts = data.counts || {};
    document.getElementById('count-all').textContent = counts.all || 0;
    document.getElementById('count-completed').textContent = counts.completed || 0;
    document.getElementById('count-processing').textContent = counts.processing || 0;
    document.getElementById('count-failed').textContent = counts.failed || 0;

    const tasks = data.data || [];
    const grid = document.getElementById('task_grid');
    grid.innerHTML = '';

    if (tasks.length === 0) {
      grid.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:3rem;grid-column:1/-1;">暂无任务</p>';
    }

    const stateMap = {1: '完成', '-1': '失败', 4: '处理中'};
    const stateClass = {1: 'complete', '-1': 'failed', 4: 'processing'};

    tasks.forEach(t => {
      const card = document.createElement('div');
      card.className = 'task-card';
      const subject = (t.params && t.params.video_subject) ? t.params.video_subject : '未命名';
      const time = t.start_time ? new Date(t.start_time).toLocaleString('zh-CN') : '-';
      const thumb = t.thumbnail_url ? `<img src="${t.thumbnail_url}" alt="thumbnail">` : `<div class="thumb-placeholder">🎬</div>`;
      const videoUrl = t.video_url || '';
      const playOverlay = videoUrl ? `<div class="play-overlay" onclick="playVideo('${t.task_id}','${subject.replace(/'/g,"\\'")}','${videoUrl}')"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>` : '';

      card.innerHTML = `
        <div class="thumb">
          ${thumb}
          ${playOverlay}
          <span class="badge ${stateClass[t.state] || 'processing'}">${stateMap[t.state] || '未知'}</span>
        </div>
        <div class="info">
          <div class="subject">${subject}</div>
          <div class="meta">
            <span class="progress-text">${t.progress || 0}%</span>
            <span>${time}</span>
          </div>
          <div class="actions">
            ${videoUrl ? `<button class="btn btn-secondary btn-sm" onclick="playVideo('${t.task_id}','${subject.replace(/'/g,"\\'")}','${videoUrl}')">▶ 播放</button>` : ''}
            <button class="btn btn-secondary btn-sm" onclick="deleteTaskCard('${t.task_id}')">🗑 删除</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });

    // Pagination
    const pg = data.pagination || {};
    const totalPages = pg.total_pages || 1;
    const total = pg.total || 0;
    const pgEl = document.getElementById('pagination');
    pgEl.innerHTML = '';

    if (totalPages > 1) {
      const prev = document.createElement('button');
      prev.textContent = '‹ 上一页';
      prev.disabled = currentPage <= 1;
      prev.onclick = () => { currentPage--; loadTasks(); };
      pgEl.appendChild(prev);

      // Page numbers (show up to 7 pages)
      let startPage = Math.max(1, currentPage - 3);
      let endPage = Math.min(totalPages, startPage + 6);
      if (endPage - startPage < 6) startPage = Math.max(1, endPage - 6);

      for (let i = startPage; i <= endPage; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        btn.className = i === currentPage ? 'active' : '';
        btn.onclick = () => { currentPage = i; loadTasks(); };
        pgEl.appendChild(btn);
      }

      const next = document.createElement('button');
      next.textContent = '下一页 ›';
      next.disabled = currentPage >= totalPages;
      next.onclick = () => { currentPage++; loadTasks(); };
      pgEl.appendChild(next);
    }

    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `共 ${total} 条，第 ${currentPage}/${totalPages} 页`;
    pgEl.appendChild(info);

  } catch (e) { showToast('加载任务失败', 'error'); }
}

// Play video in modal
function playVideo(taskId, subject, videoUrl) {
  modalTaskId = taskId;
  document.getElementById('modal_title').textContent = subject;
  document.getElementById('modal_video').src = videoUrl;
  document.getElementById('modal_download').href = videoUrl;
  document.getElementById('video_modal').classList.add('show');
}

function closeVideoModal() {
  const video = document.getElementById('modal_video');
  video.pause();
  video.src = '';
  document.getElementById('video_modal').classList.remove('show');
  modalTaskId = null;
}

function closeModal(event) {
  if (event.target === document.getElementById('video_modal')) {
    closeVideoModal();
  }
}

// Delete task from card
async function deleteTaskCard(taskId) {
  if (!confirm('确认删除此任务？')) return;
  try {
    await fetch(API + '/tasks/' + taskId, { method: 'DELETE' });
    showToast('任务已删除', 'success');
    loadTasks();
  } catch (e) { showToast('删除失败', 'error'); }
}

// Delete task from modal
async function deleteTaskFromModal() {
  if (!modalTaskId) return;
  if (!confirm('确认删除此任务？')) return;
  try {
    await fetch(API + '/tasks/' + modalTaskId, { method: 'DELETE' });
    closeVideoModal();
    showToast('任务已删除', 'success');
    loadTasks();
  } catch (e) { showToast('删除失败', 'error'); }
}

// Reset form
function resetForm() {
  document.getElementById('video_subject').value = '';
  document.getElementById('video_script').value = '';
  selectedTemplate = '';
}
</script>
