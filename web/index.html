<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SamVideo - AI Video Generator</title>
<style>
:root {
  --bg: #faf6f0;
  --card: #ffffff;
  --card-hover: #fdf5ea;
  --border: #e8ddd0;
  --text: #3d3530;
  --text-dim: #9a8d7e;
  --accent: #e8602e;
  --accent-hover: #d4501a;
  --accent-light: #fce8de;
  --green: #5a9e3e;
  --blue: #3b7dd8;
  --radius: 10px;
  --shadow: 0 2px 8px rgba(180, 160, 130, 0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
.container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

/* Header */
.header { display: flex; align-items: baseline; gap: 0.65rem; margin-bottom: 1.5rem; }
.header h1 { font-size: 2.5rem; font-weight: 700; color: var(--accent); }
.header .version { font-size: 1rem; font-weight: 600; opacity: 0.72; text-decoration: none; color: var(--text-dim); }
.header .version:hover { opacity: 1; text-decoration: underline; }

/* Form */
.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text); }
textarea, input[type="text"], input[type="number"], select {
  width: 100%; padding: 0.6rem 0.8rem; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
textarea:focus, input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
textarea { resize: vertical; min-height: 80px; }
select { cursor: pointer; }

/* Settings Grid */
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
.settings-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; box-shadow: var(--shadow); }
.settings-card h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
.settings-card .form-group { margin-bottom: 0.75rem; }
.settings-card .form-group:last-child { margin-bottom: 0; }

/* Advanced Settings */
.advanced-toggle { cursor: pointer; padding: 0.5rem 0; font-size: 0.9rem; font-weight: 500; color: var(--text-dim); user-select: none; }
.advanced-toggle:hover { color: var(--accent); }
.advanced-content { display: none; padding: 0.75rem; margin-top: 0.5rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.advanced-content.show { display: block; }

/* Buttons */
.btn { padding: 0.6rem 1.5rem; border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 6px rgba(232, 96, 46, 0.3); }
.btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 12px rgba(232, 96, 46, 0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--card-hover); border-color: var(--accent); }
.btn-sm { padding: 0.3rem 0.6rem; font-size: 0.8rem; }
.btn-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1.5rem; }

/* Progress */
.progress-bar { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #7bc043); transition: width 0.5s; border-radius: 4px; }

/* Task List */
.task-list { margin-top: 1.5rem; }
.task-row { display: grid; grid-template-columns: 100px 1fr 80px 120px 200px; gap: 0.5rem; align-items: center; padding: 0.5rem 0.6rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.3rem; box-shadow: var(--shadow); }
.task-row .status { font-size: 0.8rem; font-weight: 600; }
.task-row .status.processing { color: var(--blue); }
.task-row .status.complete { color: var(--green); }
.task-row .status.failed { color: var(--accent); }
.task-row .subject { font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-row .progress { font-size: 0.8rem; color: var(--text-dim); }
.task-row .actions { display: flex; gap: 0.25rem; }
.task-header { display: grid; grid-template-columns: 100px 1fr 80px 120px 200px; gap: 0.5rem; padding: 0 0.6rem; margin-bottom: 0.5rem; }
.task-header span { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }

/* Video Preview */
.video-preview { margin-top: 1.5rem; }
.video-preview video { width: 100%; border-radius: var(--radius); box-shadow: var(--shadow); }

/* Toast */
.toast { position: fixed; top: 1rem; right: 1rem; padding: 0.75rem 1.25rem; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); z-index: 999; opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.toast.show { opacity: 1; }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--accent); }

/* Tabs */
.tabs { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid var(--border); }
.tab { padding: 0.5rem 1rem; cursor: pointer; font-size: 0.875rem; font-weight: 600; color: var(--text-dim); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Template cards */
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
.template-card { background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); padding: 0.75rem; cursor: pointer; transition: border-color 0.2s, box-shadow 0.2s; box-shadow: var(--shadow); }
.template-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(232, 96, 46, 0.15); }
.template-card.selected { border-color: var(--accent); background: var(--accent-light); }
.template-card h4 { font-size: 0.9rem; margin-bottom: 0.25rem; color: var(--text); }
.template-card p { font-size: 0.75rem; color: var(--text-dim); }
.template-card .tags { display: flex; gap: 0.25rem; margin-top: 0.5rem; flex-wrap: wrap; }
.template-card .tag { font-size: 0.7rem; padding: 0.1rem 0.4rem; background: var(--bg); border-radius: 3px; color: var(--text-dim); }

@media (max-width: 768px) {
  .task-row, .task-header { grid-template-columns: 1fr; gap: 0.2rem; }
  .header h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>🤖 SamVideo</h1>
    <a href="https://github.com/samaidev/samvideo" target="_blank" class="version">v1.0</a>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('create')">视频生成</div>
    <div class="tab" onclick="switchTab('templates')">模板列表</div>
    <div class="tab" onclick="switchTab('tasks')">任务历史</div>
  </div>

  <!-- Create Tab -->
  <div id="tab-create">
    <!-- Subject -->
    <div class="form-group">
      <label>视频主题</label>
      <textarea id="video_subject" placeholder="输入视频主题，例如：人工智能改变未来生活" rows="3"></textarea>
    </div>

    <!-- Settings Grid -->
    <div class="settings-grid">
      <!-- Video Settings -->
      <div class="settings-card">
        <h3>视频设置</h3>
        <div class="form-group">
          <label>宽高比</label>
          <select id="video_aspect">
            <option value="">自动（LLM分类）</option>
            <option value="16:9">16:9 横屏</option>
            <option value="9:16">9:16 竖屏</option>
            <option value="1:1">1:1 正方形</option>
          </select>
        </div>
        <div class="form-group">
          <label>片段时长 (秒)</label>
          <input type="number" id="video_clip_duration" value="5" min="1" max="15">
        </div>
        <div class="form-group">
          <label>播放速度</label>
          <input type="number" id="video_clip_speed" value="1.0" min="0.5" max="2.0" step="0.1">
        </div>
        <div class="form-group">
          <label>转场模式</label>
          <select id="video_transition_mode">
            <option value="">自动</option>
            <option value="shuffle">随机</option>
            <option value="fade_in">淡入</option>
            <option value="fade_out">淡出</option>
            <option value="none">无</option>
          </select>
        </div>
      </div>

      <!-- Voice Settings -->
      <div class="settings-card">
        <h3>配音设置</h3>
        <div class="form-group">
          <label>语音音色</label>
          <select id="voice_name">
            <option value="">自动</option>
            <option value="zh-CN-YunxiNeural">云希（男声）</option>
            <option value="zh-CN-YunyangNeural">云扬（男声）</option>
            <option value="zh-CN-XiaoxiaoNeural">晓晓（女声）</option>
            <option value="zh-CN-XiaoyiNeural">晓伊（女声）</option>
            <option value="zh-CN-YunjianNeural">云健（男声）</option>
          </select>
        </div>
        <div class="form-group">
          <label>语速</label>
          <input type="number" id="voice_rate" value="1.0" min="0.5" max="2.0" step="0.1">
        </div>
      </div>

      <!-- Subtitle Settings -->
      <div class="settings-card">
        <h3>字幕设置</h3>
        <div class="form-group">
          <label>字幕</label>
          <select id="subtitle_enabled">
            <option value="true">开启</option>
            <option value="false">关闭</option>
          </select>
        </div>
        <div class="form-group">
          <label>字幕来源</label>
          <select id="subtitle_provider">
            <option value="edge">Edge (自动)</option>
          </select>
        </div>
      </div>

      <!-- BGM Settings -->
      <div class="settings-card">
        <h3>背景音乐</h3>
        <div class="form-group">
          <label>BGM 类型</label>
          <select id="bgm_type">
            <option value="random">随机选择</option>
            <option value="none">无</option>
          </select>
        </div>
        <div class="form-group">
          <label>BGM 音量</label>
          <input type="number" id="bgm_volume" value="0.55" min="0" max="1.0" step="0.05">
        </div>
      </div>
    </div>

    <!-- Advanced Settings -->
    <div class="advanced-toggle" onclick="toggleAdvanced()">▶ 高级设置</div>
    <div class="advanced-content" id="advanced_content">
      <div class="settings-grid">
        <div class="settings-card">
          <h3>素材设置</h3>
          <div class="form-group">
            <label>素材来源</label>
            <select id="video_source">
              <option value="">默认</option>
              <option value="openai_image">AI文生图</option>
              <option value="local">本地素材</option>
            </select>
          </div>
        </div>
        <div class="settings-card">
          <h3>自定义脚本</h3>
          <div class="form-group">
            <label>视频脚本（可选，留空自动生成）</label>
            <textarea id="video_script" rows="3" placeholder="输入自定义脚本，留空则由AI自动生成"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Generate Button -->
    <div class="btn-row" style="margin-top: 1rem;">
      <button class="btn btn-primary" id="generate_btn" onclick="generateVideo()">🎬 生成视频</button>
      <button class="btn btn-secondary" onclick="resetForm()">重置</button>
    </div>

    <!-- Current Task Progress -->
    <div id="current_task" style="display:none;">
      <h3 style="margin-bottom: 0.5rem;">当前任务</h3>
      <div class="task-row" style="grid-template-columns: 1fr 80px;">
        <div>
          <span class="status processing" id="current_status">处理中</span>
          <span class="subject" id="current_subject"></span>
        </div>
        <div class="progress" id="current_progress">0%</div>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="current_progress_bar" style="width: 0%"></div></div>
    </div>

    <!-- Video Preview -->
    <div class="video-preview" id="video_preview" style="display:none;">
      <h3 style="margin-bottom: 0.5rem;">视频预览</h3>
      <video id="preview_video" controls></video>
      <div style="margin-top: 0.5rem;">
        <a class="btn btn-secondary btn-sm" id="download_link" download>⬇ 下载视频</a>
      </div>
    </div>
  </div>

  <!-- Templates Tab -->
  <div id="tab-templates" style="display:none;">
    <h3 style="margin-bottom: 1rem;">可用模板</h3>
    <div class="template-grid" id="template_grid"></div>
  </div>

  <!-- Tasks Tab -->
  <div id="tab-tasks" style="display:none;">
    <h3 style="margin-bottom: 1rem;">任务历史</h3>
    <div class="task-header">
      <span>状态</span><span>主题</span><span>进度</span><span>时间</span><span>操作</span>
    </div>
    <div id="task_list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = window.location.origin + '/api/v1';
let selectedTemplate = '';
let pollTimer = null;

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(d => d.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'templates') loadTemplates();
  if (tab === 'tasks') loadTasks();
}

// Advanced settings toggle
function toggleAdvanced() {
  const content = document.getElementById('advanced_content');
  const toggle = event.target;
  content.classList.toggle('show');
  toggle.textContent = content.classList.contains('show') ? '▼ 高级设置' : '▶ 高级设置';
}

// Toast
function showToast(msg, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show ' + type;
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// Generate video
async function generateVideo() {
  const subject = document.getElementById('video_subject').value.trim();
  if (!subject) { showToast('请输入视频主题', 'error'); return; }

  const params = { video_subject: subject };
  const fields = {
    video_aspect: 'video_aspect', video_clip_duration: 'video_clip_duration',
    video_clip_speed: 'video_clip_speed', video_transition_mode: 'video_transition_mode',
    voice_name: 'voice_name', voice_rate: 'voice_rate',
    subtitle_enabled: 'subtitle_enabled', subtitle_provider: 'subtitle_provider',
    bgm_type: 'bgm_type', bgm_volume: 'bgm_volume',
    video_source: 'video_source', video_script: 'video_script'
  };
  for (const [id, key] of Object.entries(fields)) {
    const el = document.getElementById(id);
    if (!el) continue;
    let val = el.value.trim();
    if (!val) continue;
    if (key === 'video_clip_duration' || key === 'voice_rate' || key === 'bgm_volume' || key === 'video_clip_speed') {
      val = parseFloat(val);
    }
    if (key === 'subtitle_enabled') val = val === 'true';
    params[key] = val;
  }

  let url = API + '/videos';
  if (selectedTemplate) url += '?template_id=' + selectedTemplate;

  document.getElementById('generate_btn').disabled = true;
  document.getElementById('generate_btn').textContent = '⏳ 生成中...';

  try {
    const resp = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(params)
    });
    const data = await resp.json();
    if (data.status === 200) {
      const taskId = data.data.task_id;
      showToast('任务已提交: ' + taskId.substring(0, 8) + '...', 'success');
      document.getElementById('current_task').style.display = 'block';
      document.getElementById('current_subject').textContent = subject;
      pollTask(taskId);
    } else {
      showToast('提交失败: ' + (data.error || '未知错误'), 'error');
      resetGenerateBtn();
    }
  } catch (e) {
    showToast('网络错误: ' + e.message, 'error');
    resetGenerateBtn();
  }
}

function resetGenerateBtn() {
  document.getElementById('generate_btn').disabled = false;
  document.getElementById('generate_btn').textContent = '🎬 生成视频';
}

// Poll task status
function pollTask(taskId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const resp = await fetch(API + '/tasks/' + taskId);
      const data = await resp.json();
      const task = data.data;
      if (!task) return;
      const progress = task.progress || 0;
      document.getElementById('current_progress').textContent = progress + '%';
      document.getElementById('current_progress_bar').style.width = progress + '%';

      const stateMap = {1: '完成', 2: '失败', 4: '处理中', 5: '完成'};
      const stateText = stateMap[task.state] || '处理中';
      const statusEl = document.getElementById('current_status');
      statusEl.textContent = stateText;
      statusEl.className = 'status ' + (task.state === 1 ? 'complete' : task.state === 2 ? 'failed' : 'processing');

      if (task.state === 1 || (task.state === 5)) {
        clearInterval(pollTimer); pollTimer = null;
        resetGenerateBtn();
        if (task.video_url) {
          document.getElementById('video_preview').style.display = 'block';
          document.getElementById('preview_video').src = API.replace('/api/v1', '') + task.video_url;
          document.getElementById('download_link').href = API.replace('/api/v1', '') + task.video_url;
        }
        showToast('视频生成完成！', 'success');
      } else if (task.state === 2 || task.error) {
        clearInterval(pollTimer); pollTimer = null;
        resetGenerateBtn();
        showToast('生成失败: ' + (task.error || '未知错误'), 'error');
      }
    } catch (e) { console.error(e); }
  }, 3000);
}

// Load templates
async function loadTemplates() {
  try {
    const resp = await fetch(API + '/templates');
    const data = await resp.json();
    const grid = document.getElementById('template_grid');
    grid.innerHTML = '';
    (data.data || []).forEach(t => {
      const card = document.createElement('div');
      card.className = 'template-card' + (selectedTemplate === t.id ? ' selected' : '');
      card.onclick = () => { selectedTemplate = selectedTemplate === t.id ? '' : t.id; loadTemplates(); };
      card.innerHTML = `
        <h4>${t.name}</h4>
        <p>${t.description}</p>
        <div class="tags">
          <span class="tag">${t.aspect}</span>
          <span class="tag">${t.clip_duration}s</span>
          <span class="tag">${t.clip_speed}x</span>
          <span class="tag">${t.transition_mode}</span>
          <span class="tag">BGM ${t.bgm_volume}</span>
        </div>`;
      grid.appendChild(card);
    });
  } catch (e) { showToast('加载模板失败', 'error'); }
}

// Load tasks
async function loadTasks() {
  try {
    const resp = await fetch(API + '/tasks');
    const data = await resp.json();
    const list = document.getElementById('task_list');
    list.innerHTML = '';
    (data.data || []).forEach(t => {
      const stateMap = {1: '完成', 2: '失败', 4: '处理中', 5: '完成'};
      const stateClass = t.state === 1 ? 'complete' : t.state === 2 ? 'failed' : 'processing';
      const row = document.createElement('div');
      row.className = 'task-row';
      const time = t.start_time ? new Date(t.start_time).toLocaleString('zh-CN') : '-';
      const videoUrl = t.video_url ? API.replace('/api/v1','') + t.video_url : '#';
      row.innerHTML = `
        <span class="status ${stateClass}">${stateMap[t.state] || '未知'}</span>
        <span class="subject">${t.params?.video_subject || '-'}</span>
        <span class="progress">${t.progress || 0}%</span>
        <span style="font-size:0.75rem;color:var(--text-dim)">${time}</span>
        <span class="actions">
          ${t.video_url ? `<a class="btn btn-secondary btn-sm" href="${videoUrl}" target="_blank">▶ 播放</a>` : ''}
          <button class="btn btn-secondary btn-sm" onclick="deleteTask('${t.task_id}')">🗑 删除</button>
        </span>`;
      list.appendChild(row);
    });
    if (!data.data || data.data.length === 0) {
      list.innerHTML = '<p style="color:var(--text-dim);text-align:center;padding:2rem;">暂无任务</p>';
    }
  } catch (e) { showToast('加载任务失败', 'error'); }
}

// Delete task
async function deleteTask(taskId) {
  if (!confirm('确认删除此任务？')) return;
  try {
    await fetch(API + '/tasks/' + taskId, { method: 'DELETE' });
    showToast('任务已删除', 'success');
    loadTasks();
  } catch (e) { showToast('删除失败', 'error'); }
}

// Reset form
function resetForm() {
  document.getElementById('video_subject').value = '';
  document.getElementById('video_script').value = '';
  selectedTemplate = '';
}
</script>
</body>
</html>
